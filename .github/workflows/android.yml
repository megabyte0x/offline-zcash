name: Android APK

on:
  workflow_call:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: aarch64-linux-android
      # Tagged release builds never restore branch or pull-request caches.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          key: android-arm64
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: ${{ startsWith(github.ref, 'refs/tags/') }}
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build arm64 APK and Kotlin contract
        run: |
          ./android/build.sh
          ./android/gradlew -p android --no-daemon :contract:compileKotlin :app:lintRelease
      - name: Package and verify version
        shell: bash
        run: |
          version=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo '::error::tag and workspace version differ'; exit 1
          fi
          apk=android/app/build/outputs/apk/release/app-release.apk
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          grep -F "versionName='$version'" <<< "$badging"
          mkdir -p dist
          cp "$apk" "dist/offline-zcash-$version-arm64-v8a.apk"
          (cd dist && sha256sum *.apk > "offline-zcash-$version-arm64-v8a.apk.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error
