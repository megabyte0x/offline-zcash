name: Android APK

on:
  workflow_call:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64
      - uses: gradle/actions/setup-gradle@v4
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build arm64 APK and Kotlin contract
        run: |
          ./android/build.sh
          ./android/gradlew -p android --no-daemon :contract:compileKotlin :app:lintRelease
      - name: Package and verify version
        shell: bash
        run: |
          version=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo '::error::tag and workspace version differ'; exit 1
          fi
          apk=android/app/build/outputs/apk/release/app-release.apk
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          grep -F "versionName='$version'" <<< "$badging"
          mkdir -p dist
          cp "$apk" "dist/offline-zcash-$version-arm64-v8a.apk"
          (cd dist && sha256sum *.apk > "offline-zcash-$version-arm64-v8a.apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error
