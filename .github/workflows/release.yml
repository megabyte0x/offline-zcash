name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 is retired on 2026-11-02 and macos-13 was retired on 2025-12-04.
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          # ubuntu-22.04 has glibc 2.35, so the binary runs on Debian 12 and Ubuntu 22.04+.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    env:
      # Let the macOS binaries run on releases older than the runner's.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=ozm-node-$version-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The Zakura crates (zakura-orchard and friends) take a few minutes to compile.
      - name: Build
        run: cargo build --release --locked -p ozm-node --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="$(./target/${{ matrix.target }}/release/ozm-node --version)"
          echo "$out"
          # A tag must match the crate version, or testers get a mislabelled binary.
          if [[ "$GITHUB_REF" == refs/tags/v* && "$out" != *" $VERSION" ]]; then
            echo "::error::ozm-node --version printed '$out' but the tag is v$VERSION; bump the workspace version first"
            exit 1
          fi

      - name: Package
        shell: bash
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p "dist/$NAME/docs"
          cp "target/${{ matrix.target }}/release/ozm-node" "dist/$NAME/"
          cp README.md "dist/$NAME/"
          cp docs/install.md "dist/$NAME/docs/"
          cd dist
          tar -czf "$NAME.tar.gz" "$NAME"
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi
          cat "$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            dist/${{ steps.version.outputs.name }}.tar.gz
            dist/${{ steps.version.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ozm-node-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
