name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/test-release-notes.py
      - name: Require matching changelog section
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release-notes.py "$TAG" > release-notes.md

  android:
    uses: ./.github/workflows/android.yml

  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 is retired on 2026-11-02 and macos-13 was retired on 2025-12-04.
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          # ubuntu-22.04 has glibc 2.35, so the binary runs on Debian 12 and Ubuntu 22.04+.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    env:
      # Let the macOS binaries run on releases older than the runner's.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=ozm-node-$version-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # The Zakura crates (zakura-orchard and friends) take a few minutes to compile.
      - name: Build
        run: cargo build --release --locked -p ozm-node --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="$(./target/${{ matrix.target }}/release/ozm-node --version)"
          echo "$out"
          # A tag must match the crate version, or testers get a mislabelled binary.
          if [[ "$GITHUB_REF" == refs/tags/v* && "$out" != *" $VERSION" ]]; then
            echo "::error::ozm-node --version printed '$out' but the tag is v$VERSION; bump the workspace version first"
            exit 1
          fi

      - name: Package
        shell: bash
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p "dist/$NAME/docs"
          cp "target/${{ matrix.target }}/release/ozm-node" "dist/$NAME/"
          cp README.md "dist/$NAME/"
          cp docs/install.md "dist/$NAME/docs/"
          cd dist
          tar -czf "$NAME.tar.gz" "$NAME"
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi
          cat "$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            dist/${{ steps.version.outputs.name }}.tar.gz
            dist/${{ steps.version.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  lgx:
    name: lgx ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-22.04
          - platform: linux-arm64
            os: ubuntu-22.04-arm
          - platform: darwin-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU=

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Portable variants: what released Basecamp builds install (docs/basecamp-install.md).
      - name: Build portable .lgx packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          for m in zcash_offline_module zcash_offline_ui zcash_offline_organiser zcash_offline_gateway; do
            (cd "logos/$m" && nix build .#lgx-portable --accept-flake-config -L -o "$GITHUB_WORKSPACE/out-$m")
            cp out-$m/*.lgx "dist/$m-$VERSION-$PLATFORM.lgx"
          done
          cd dist
          for f in *.lgx; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -l

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lgx-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [notes, build, lgx, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU=

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: logos-co/logos-modules-release-tool
          ref: 94462e6633f2b536424c10ceda3c371f7ec8e09d
          path: catalogue-tool

      - name: Merge platforms and generate verified catalogue
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Same logos-package revision as the module-builder lock; hashes already exist.
          nix build github:logos-co/logos-package/c25a1167578aef5cbd9a9b6f822ffe2ae4fd6a89#lgx -o lgx-tool
          export PATH="$PWD/lgx-tool/bin:$PATH"
          version="${TAG#v}"
          : > catalogue-urls.txt
          for m in zcash_offline_module zcash_offline_ui zcash_offline_organiser zcash_offline_gateway; do
            # One version/root per name: clients select versions before platform variants.
            lgx merge dist/"$m-$version-"{linux-amd64,linux-arm64,darwin-arm64}.lgx -o "dist/$m-$version.lgx" -y
            lgx verify "dist/$m-$version.lgx"
            lgx manifest "dist/$m-$version.lgx" --json | jq -e --arg v "$version" '.version == $v'
            printf '%s %s\n' "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$m-$version.lgx" "dist/$m-$version.lgx" >> catalogue-urls.txt
          done
          python3 catalogue-tool/index.py build catalogue-urls.txt --fetch none --name offline-zcash --icons-dir '' -o dist/index.json
          python3 catalogue-tool/index.py validate dist/index.json --full --pairs-file catalogue-urls.txt --fetch none
          python3 catalogue-tool/index.py validate-repo logos-repo.json
          jq --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/index.json" '.indexUrl = $url' logos-repo.json > dist/logos-repo.json
          (cd dist && sha256sum *.lgx *.json *.png > catalogue.sha256)

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release-notes.py "$TAG" > release-notes.md
          ls -l dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.lgx dist/*.apk dist/*.sha256 dist/*.json dist/*.png --clobber
          gh release edit "$TAG" --notes-file release-notes.md --draft=false --latest
