name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    uses: ./.github/workflows/android.yml

  linux:
    name: clippy + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Release notes contract
        run: |
          python3 scripts/test-release-notes.py
          version=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
          python3 scripts/release-notes.py "v$version"
      # The Zakura crates (zakura-orchard and friends) take a few minutes to compile.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --release

  macos:
    name: build ozm-node (macOS arm64)
    # macos-14 is retired on 2026-11-02; macos-15 is the arm64 replacement.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p ozm-node
      - name: Smoke test
        run: ./target/release/ozm-node --version
