name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    uses: ./.github/workflows/android.yml

  linux:
    name: clippy + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject internal thread links
        run: |
          needle='amp''code.com/threads'
          if git grep -n -F "$needle"; then
            echo '::error::Remove internal thread links from tracked files'
            exit 1
          else
            test "$?" -eq 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Release notes contract
        run: |
          python3 scripts/test-release-notes.py
          version=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
          python3 scripts/release-notes.py "v$version"
      # The Zakura crates (zakura-orchard and friends) take a few minutes to compile.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --release

  macos:
    name: build ozm-node (macOS arm64)
    # macos-14 is retired on 2026-11-02; macos-15 is the arm64 replacement.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release -p ozm-node
      - name: Smoke test
        run: ./target/release/ozm-node --version
