name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides which builds a change can affect. Docs- or CHANGELOG-only changes run only `checks`.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      android: ${{ steps.diff.outputs.android }}
      module: ${{ steps.diff.outputs.module }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Unknown base (new branch, force push): run everything.
          if [[ "$BASE" =~ ^0*$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=ALL
          else
            files=$(git diff --name-only "$BASE...$HEAD")
          fi
          printf '%s\n' "$files"
          touched() { [[ "$files" == ALL ]] || grep -qE "$1" <<< "$files"; }
          if touched '^(crates/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'; then rust=true; else rust=false; fi
          if touched '^(android/|crates/ozm-ffi/|\.github/workflows/(ci|android)\.yml$)'; then android=true; else android=false; fi
          # The Basecamp module compiles the crates below with its own Cargo.lock; only releases built it before.
          if touched '^(crates/(zcash-offline-core|ozm-mesh|ozm-ble|ozm-node)/|logos/zcash_offline_module/|\.github/workflows/ci\.yml$)'; then module=true; else module=false; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "module=$module" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"

  checks:
    name: thread links + release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject internal thread links
        run: |
          needle='amp''code.com/threads'
          if git grep -n -F "$needle"; then
            echo '::error::Remove internal thread links from tracked files'
            exit 1
          else
            test "$?" -eq 1
          fi
      - name: Release notes contract
        run: |
          python3 scripts/test-release-notes.py
          # Candidate versions keep their notes under Unreleased. The release workflow
          # still requires an exact section for its tag before publishing anything.
          version=$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\] - .*/\1/p' CHANGELOG.md | head -1)
          python3 scripts/release-notes.py "v$version"

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android.yml

  linux:
    name: clippy + test (ubuntu)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The Zakura crates (zakura-orchard and friends) take a few minutes to compile.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --release

  macos:
    name: build ozm-node (macOS arm64)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # macos-14 is retired on 2026-11-02; macos-15 is the arm64 replacement.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release -p ozm-node
      - name: Smoke test
        run: ./target/release/ozm-node --version

  module:
    name: build Basecamp module (linux)
    needs: changes
    if: needs.changes.outputs.module == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU=
      - name: Build
        run: cd logos/zcash_offline_module && nix build .#lgx --accept-flake-config -L
