[package]
name = "zcash-offline-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline Zcash (Ironwood, NU7) payments: wallet sync, offline builder, payee checks, sealed envelopes"

[dependencies]
orchard = { package = "zakura-orchard", version = "=2.2.0", features = ["circuit"] }
zcash_primitives = { package = "zakura-primitives", version = "=2.2.0", features = ["circuits", "std", "multicore"] }
zcash_protocol = { package = "zakura-protocol", version = "=2.2.0", features = ["local-consensus"] }
zcash_keys = { package = "zakura-keys", version = "=2.2.0", features = ["orchard", "sapling"] }
zcash_note_encryption = "0.4.2"
incrementalmerkletree = "0.8.2"
shardtree = "0.7"
rand = { version = "0.10", features = ["sys_rng"] }
blake2b_simd = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
bincode = "1.3"
tracing = "0.1"
pasta_curves = { package = "zakura-pasta-curves", version = "=2.2.0" }
group = "0.14"
ff = "0.14"
