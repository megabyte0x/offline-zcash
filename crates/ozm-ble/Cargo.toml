[package]
name = "ozm-ble"
description = "Native BLE byte streams for ozm-mesh (Linux BlueZ backend)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
ozm-mesh = { path = "../ozm-mesh" }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros"] }
tracing = "0.1"
uuid = "1"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "=0.17.4", features = ["bluetoothd"] }
# Compile libdbus into the binary/staticlib, including portable Logos packages.
dbus = { version = "0.9", features = ["vendored"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
