[package]
name = "ozm-node"
description = "Offline Zcash mesh node: payer, relay, payee and gateway roles with a local HTTP API"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ozm-node"
path = "src/main.rs"

[dependencies]
zcash-offline-core = { path = "../zcash-offline-core" }
ozm-mesh = { path = "../ozm-mesh" }
ozm-ble = { path = "../ozm-ble" }
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", default-features = false, features = ["json"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3"
