<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ozm-api-token" content="__OZM_API_TOKEN__">
<title>Offline Zcash</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --fg:#e7e9ee; --mut:#8a93a6; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --acc:#f4b728; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; } header h1 span { color:var(--acc); }
  .pill { padding:2px 8px; border-radius:99px; background:var(--card); border:1px solid var(--line); color:var(--mut); font-size:12px; }
  main { padding:20px; display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); max-width:1200px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; min-width:0; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:0 0 10px; }
  .big { font-size:26px; font-weight:600; }
  .mut { color:var(--mut); } .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; word-break:break-all; }
  label { display:block; margin:8px 0 4px; color:var(--mut); }
  input, select, button { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:#0c0e12; color:var(--fg); font:inherit; }
  button { background:var(--acc); color:#111; font-weight:600; border:0; margin-top:12px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .wide { grid-column: 1 / -1; overflow-x:auto; }
  table { width:100%; min-width:720px; border-collapse:collapse; } td, th { text-align:left; padding:8px 6px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:500; font-size:12px; }
  .st { font-weight:600; } .st.mined { color:var(--ok); } .st.refused, .st.gateway-rejected { color:var(--bad); } .st.accepted-pending, .st.submitted, .st.delivered, .st.sent, .st.in-mempool { color:var(--warn); }
  details summary { cursor:pointer; color:var(--mut); }
  #msg { margin-top:8px; min-height:1.4em; }
</style>
</head>
<body>
<header>
  <h1><span>ⓩ</span> Offline Zcash <span class="mut" id="ver"></span></h1>
  <span class="pill" id="who">…</span>
  <span class="pill" id="online">…</span>
  <span class="pill" id="nbrs">…</span>
</header>
<main>
  <section>
    <h2>Wallet</h2>
    <div class="big" id="bal">…</div>
    <div class="mut" id="wal"></div>
    <div class="mut" id="gateway"></div>
    <button id="syncb">Sync now</button>
    <button id="fundb">Get test funds from the gateway (5 × 0.1 ZEC)</button>
    <div class="mut" id="syncmsg"></div>
  </section>
  <section>
    <h2>Pay offline</h2>
    <label for="to">Recipient Zcash address</label><input id="to" placeholder="uregtest…" autocomplete="off" spellcheck="false">
    <label for="amt">Amount (ZEC)</label><input id="amt" value="0.01" inputmode="decimal">
    <button id="maxb">Max</button>
    <button id="payb">Build, prove and send over the mesh</button>
    <div id="msg" class="mut"></div>
  </section>
  <section>
    <h2>Receive</h2>
    <div class="mono" id="addr"></div>
    <button id="copyb">Copy your address</button>
    <p class="mut">Open or unknown payers are not accepted pending. Wait for gateway-reported inclusion; it is not independent chain verification.</p>
  </section>
  <section class="wide">
    <h2>Payments</h2>
    <table><thead><tr><th>When</th><th>Direction</th><th>With</th><th>Amount</th><th>State</th><th>Transaction</th></tr></thead><tbody id="pays"></tbody></table>
    <div id="refs" class="mut"></div>
  </section>
  <section class="wide">
    <h2>Mesh</h2>
    <div class="mono" id="mesh"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const zec = (z) => (z / 1e8).toFixed(8).replace(/0+$/, '').replace(/\.$/, '') + ' ZEC';
async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'content-type': 'application/json', 'x-ozm-token': document.querySelector('meta[name="ozm-api-token"]').content }, ...(body ? { body: JSON.stringify(body) } : {}) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function element(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}
async function refresh() {
  try {
    const s = await api('/api/status');
    $('ver').textContent = 'v' + s.version;
    $('who').textContent = s.name + ' · ' + s.role;
    $('online').textContent = s.online ? 'gateway / online' : 'offline';
    $('nbrs').textContent = 'mesh neighbours: ' + (s.neighbor_links.map(n => `${n.name} (${n.kind.toUpperCase()})`).join(', ') || 'none');
    $('bal').textContent = zec(s.wallet.spendable);
    $('wal').textContent = `locked in pending payments: ${zec(s.wallet.locked)} · ${s.wallet.notes} notes · synced to height ${s.wallet.tip}`;
    const g = s.selected_gateway;
    $('gateway').textContent = g ? `Gateway ${g.name} · ${g.peer_id} · ${g.hops} hops · tip ${g.tip} (gateway-reported)` : s.online ? 'Local chain RPC · results are gateway-reported' : 'Finding a gateway · sync and results are gateway-reported';
    if (s.gateway_warning) $('gateway').textContent += ' · WARNING: ' + s.gateway_warning;
    $('addr').textContent = s.address || '';
    $('syncb').textContent = s.online ? 'Sync now (from the node)' : 'Sync now (from a gateway over the mesh)';
    $('fundb').style.display = s.online ? 'none' : '';
    $('mesh').textContent = `peer ${s.peer_id} · frames sent ${s.mesh.frames_sent} / received ${s.mesh.frames_received} · relayed ${s.mesh.packets_relayed} · stored ${s.mesh.stored} · Bluetooth ${s.ble ? (s.ble_running ? 'on' : 'stopped — restart node') : 'off'}`;
    const p = await api('/api/payments');
    $('pays').replaceChildren();
    for (const x of p.payments.sort((a, b) => b.created_ms - a.created_ms)) {
      const row = element('tr');
      row.append(element('td', new Date(x.created_ms).toLocaleTimeString()), element('td', x.direction), element('td', x.counterparty, 'mono'), element('td', zec(x.amount)));
      const state = element('td');
      state.append(element('span', x.state, 'st ' + (['mined', 'refused', 'gateway-rejected'].includes(x.state) ? x.state : 'submitted')));
      if (x.direction === 'sent' && !x.receipt_peer) state.append(element('div', 'No payee receipt', 'mut'));
      const details = element('details');
      details.append(element('summary', 'history'));
      for (const h of x.history) details.append(element('div', new Date(h.ms).toLocaleTimeString() + ' ' + h.event, 'mut'));
      state.append(details);
      row.append(state, element('td', x.txid, 'mono'));
      $('pays').append(row);
    }
    if (!p.payments.length) {
      const cell = element('td', 'No payments yet', 'mut'); cell.colSpan = 6;
      const row = element('tr'); row.append(cell); $('pays').append(row);
    }
    $('refs').replaceChildren(...p.refusals.map(r => element('div', `Refused from ${r.from}: code ${r.reject.code} ${r.reject.reason}`)));
  } catch (e) { $('who').textContent = 'node not reachable: ' + e.message; }
}
$('payb').onclick = async () => {
  $('payb').disabled = true; $('msg').textContent = 'Proving…';
  try { const p = await api('/api/pay', { to: $('to').value, amount: $('amt').value }); $('msg').textContent = 'Sent ' + p.txid.slice(0, 16) + '…'; }
  catch (e) { $('msg').textContent = e.message; }
  $('payb').disabled = false; refresh();
};
$('maxb').onclick = async () => {
  try { const r = await api('/api/max'); $('amt').value = r.amount; $('msg').textContent = `Builder fee: ${zec(r.fee_zat)}. Quote changes if your spendable notes change.`; }
  catch (e) { $('msg').textContent = e.message; }
};
$('copyb').onclick = async () => {
  try { await navigator.clipboard.writeText($('addr').textContent); $('copyb').textContent = 'Copied'; }
  catch (_) { $('copyb').textContent = 'Select and copy the address above'; }
};
$('syncb').onclick = async () => {
  $('syncb').disabled = true; $('syncmsg').textContent = 'Syncing…';
  try { const r = await api('/api/sync', {}); $('syncmsg').textContent = r.requested_from ? `Asked ${r.requested_from} for blocks; balance updates when they arrive` : `Synced to ${r.tip}, ${r.new_notes} new notes`; }
  catch (e) { $('syncmsg').textContent = e.message; }
  $('syncb').disabled = false; refresh();
};
$('fundb').onclick = async () => {
  $('fundb').disabled = true; $('syncmsg').textContent = 'Asking the gateway for test funds…';
  try { const r = await api('/api/fund', { notes: 5, amount: '0.1' }); $('syncmsg').textContent = `Asked ${r.requested_from}; funds arrive after they are mined (about a minute)`; }
  catch (e) { $('syncmsg').textContent = e.message; }
  $('fundb').disabled = false;
};
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
