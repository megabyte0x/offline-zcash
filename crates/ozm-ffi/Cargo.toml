[package]
name = "ozm-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UniFFI device API and bounded native BLE stream bridge"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ozm-bindgen"
path = "src/bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
ozm-node = { path = "../ozm-node" }
zcash-offline-core = { path = "../zcash-offline-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uniffi = "=0.29.4"
