[package]
name = "ozm-mesh"
description = "BitChat-style mesh (TTL flooding, fragments, dedup, store-and-forward, acks) over TCP links"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
